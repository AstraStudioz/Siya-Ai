name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Detect active Java major version
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | sed -E 's/.*version "([0-9]+).*/\1/')
          
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect active Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or newer. Detected: $JAVA_MAJOR"
            exit 1
          fi
          
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found. Preserving existing keystore."
          else
            echo "Generating temporary debug.keystore..."
            KEYTOOL_BIN="$JAVA_HOME/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi
            
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          
          echo "Temporary debug keystore confirmed at ./debug.keystore"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at: $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk directory for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Build failed because expected debug APK is missing."
            exit 1
          fi
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file."
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is an empty file (0 bytes)."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac
          
          echo "Successfully verified debug APK at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        id: prepare_asset
        run: |
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          # Create temporary directory inside runner outside of repository
          RELEASE_TMP_DIR="${{ runner.temp }}/release_assets_${{ github.run_number }}"
          mkdir -p "$RELEASE_TMP_DIR"
          
          APK_FILENAME="Siya-AI-build-${{ github.run_number }}.apk"
          APK_TARGET_PATH="$RELEASE_TMP_DIR/$APK_FILENAME"
          
          # Copy single APK preserving format
          cp "$ORIGINAL_APK" "$APK_TARGET_PATH"
          
          if [ ! -s "$APK_TARGET_PATH" ]; then
            echo "ERROR: Failed to copy APK to $APK_TARGET_PATH or file is empty."
            exit 1
          fi
          
          echo "release_asset_path=$APK_TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "release_asset_filename=$APK_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Confirm GitHub CLI availability
          gh --version
          
          APK_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          APK_NAME="${{ steps.prepare_asset.outputs.release_asset_filename }}"
          
          # Confirm APK asset exists
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK asset not found at: $APK_PATH"
            exit 1
          fi
          
          # Confirm APK is a regular, non-empty .apk file
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Release APK asset is empty: $APK_PATH"
            exit 1
          fi
          
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset $APK_PATH is not an .apk file."
              exit 1
              ;;
          esac
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Siya AI"
          
          echo "Publishing GitHub Release with title '$RELEASE_TITLE' and single APK asset $APK_NAME..."
          
          gh release create "$RELEASE_TAG" \
            "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "" \
            --target "${{ github.sha }}" \
            --latest
          
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Siya AI"
          APK_NAME="${{ steps.prepare_asset.outputs.release_asset_filename }}"
          
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "Confirming release with gh release view..."
            gh release view "$RELEASE_TAG" || true
            
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG")
            
            echo "========================================================"
            echo "GITHUB RELEASE PUBLISHED SUCCESSFULLY"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Tag: $RELEASE_TAG"
            echo "Direct Release URL: $RELEASE_URL"
            echo "Single APK Asset: $APK_NAME"
            echo "========================================================"
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## :white_check_mark: Siya AI Release Published Successfully!
            
            - **Release Title**: $RELEASE_TITLE
            - **Release Tag**: \`$RELEASE_TAG\`
            - **Download APK**: [$APK_NAME]($RELEASE_URL)
            - **Release Page**: [$RELEASE_URL]($RELEASE_URL)
            
            The single APK file is directly downloadable from the **Assets** section of the release page.
            
            *Backup*: The standard Actions artifact named \`app-debug-apk\` is also available in this workflow run.
            EOF
          else
            echo "::warning ::Release publishing failed or was not completed, but the debug APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available for download."
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## :warning: Debug APK Build Succeeded (Release Publishing Failed)
            
            - **APK Build Status**: Succeeded
            - **Actions Artifact**: \`app-debug-apk\` (available for download in this workflow run summary)
            - **Notice**: Release publishing could not be completed with the current token permissions. The APK artifact remains preserved and downloadable from this run's summary.
            EOF
          fi
