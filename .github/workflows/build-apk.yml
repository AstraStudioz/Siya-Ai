name: Build and Publish Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure signing keystore
        id: setup_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding fixed release keystore from secrets.KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ./release.keystore
            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "using_custom_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "KEYSTORE_BASE64 secret not set. Creating standard signing keystore..."
            KEYTOOL_BIN="$JAVA_HOME/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./release.keystore \
              -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" \
              -alias "${{ secrets.KEY_ALIAS || 'upload' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" \
              -dname "CN=Siya AI Release,O=AstraStudioz,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD || 'android' }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> "$GITHUB_ENV"
            echo "using_custom_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute version code & name
        id: versioning
        run: |
          # Strictly monotonically incremented build version
          BUILD_NUM=${{ github.run_number }}
          VERSION_CODE=$(( 100 + BUILD_NUM ))
          VERSION_NAME="1.0.$VERSION_CODE"
          
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          
          echo "Build Version Code: $VERSION_CODE"
          echo "Build Version Name: $VERSION_NAME"

      - name: Build signed release APK
        run: |
          gradle :app:assembleRelease \
            -PversionCode="${{ steps.versioning.outputs.version_code }}" \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            --stacktrace --no-daemon

      - name: Verify release APK
        id: verify_apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            # Check unsigned or fallback
            EXPECTED_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Release APK not generated or is empty."
            exit 1
          fi

          echo "apk_path=$EXPECTED_APK" >> "$GITHUB_OUTPUT"
          echo "Found signed APK at $EXPECTED_APK"

      - name: Prepare release assets & compute checksum
        id: prepare_assets
        run: |
          SRC_APK="${{ steps.verify_apk.outputs.apk_path }}"
          RELEASE_TMP_DIR="${{ runner.temp }}/release_assets_${{ steps.versioning.outputs.version_code }}"
          mkdir -p "$RELEASE_TMP_DIR"

          APK_FILENAME="Siya-AI-build-${{ steps.versioning.outputs.version_code }}.apk"
          FINAL_APK_PATH="$RELEASE_TMP_DIR/$APK_FILENAME"
          cp "$SRC_APK" "$FINAL_APK_PATH"

          # Calculate SHA-256
          APK_SHA256=$(sha256sum "$FINAL_APK_PATH" | awk '{print $1}')
          APK_SIZE_BYTES=$(stat -c%s "$FINAL_APK_PATH" 2>/dev/null || stat -f%z "$FINAL_APK_PATH")

          # Commit message for changelog
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" | sed 's/"/\\"/g')
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Siya AI build ${{ steps.versioning.outputs.version_name }} release"
          fi

          echo "final_apk_path=$FINAL_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$APK_FILENAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "changelog=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "release_dir=$RELEASE_TMP_DIR" >> "$GITHUB_OUTPUT"

      - name: Publish to Telegram channel via Bot API
        id: send_telegram
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          APK_PATH="${{ steps.prepare_assets.outputs.final_apk_path }}"
          APK_NAME="${{ steps.prepare_assets.outputs.apk_filename }}"
          APK_SIZE="${{ steps.prepare_assets.outputs.apk_size }}"
          V_CODE="${{ steps.versioning.outputs.version_code }}"
          V_NAME="${{ steps.versioning.outputs.version_name }}"
          CHANGELOG="${{ steps.prepare_assets.outputs.changelog }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram credentials (TG_BOT_TOKEN, TG_CHAT_ID) not configured. Skipping Telegram broadcast."
            echo "telegram_post_url=https://t.me/alphabit_s" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Telegram 50MB file size limit for bot API (52,428,800 bytes)
          MAX_TG_SIZE=52428800
          TELEGRAM_POST_URL=""

          if [ "$APK_SIZE" -le "$MAX_TG_SIZE" ]; then
            echo "Sending APK document to Telegram channel ($APK_SIZE bytes)..."
            CAPTION="🚀 <b>Siya AI v${V_NAME} (Build ${V_CODE})</b>%0A%0A📝 <i>${CHANGELOG}</i>%0A%0A🔗 <a href='${REPO_URL}/releases'>GitHub Releases</a>"
            RESPONSE=$(curl -s -S -F "chat_id=${TG_CHAT_ID}" \
              -F "document=@${APK_PATH}" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=HTML" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument")
          else
            echo "APK size ($APK_SIZE bytes) exceeds 50MB. Posting link-only announcement to Telegram..."
            TEXT="🚀 <b>Siya AI v${V_NAME} (Build ${V_CODE})</b>%0A%0A📝 <i>${CHANGELOG}</i>%0A%0A📦 <i>File size exceeds 50MB Telegram bot limit.</i>%0A⬇️ <a href='${REPO_URL}/releases/latest'>Download APK directly from GitHub</a>"
            RESPONSE=$(curl -s -S -d "chat_id=${TG_CHAT_ID}" \
              -d "text=${TEXT}" \
              -d "parse_mode=HTML" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage")
          fi

          echo "Telegram Bot API Response: $RESPONSE"

          # Extract message link if channel username or message_id available
          MSG_ID=$(echo "$RESPONSE" | grep -o '"message_id":[0-9]*' | head -1 | cut -d':' -f2)
          CHAT_USERNAME=$(echo "$RESPONSE" | grep -o '"username":"[^"]*' | head -1 | cut -d'"' -f4)

          if [ -n "$CHAT_USERNAME" ] && [ -n "$MSG_ID" ]; then
            TELEGRAM_POST_URL="https://t.me/${CHAT_USERNAME}/${MSG_ID}"
          elif [ -n "$MSG_ID" ]; then
            # Clean channel ID without -100 prefix for web link
            CLEAN_CHAT_ID=$(echo "$TG_CHAT_ID" | sed 's/^-100//; s/^-//; s/^@//')
            TELEGRAM_POST_URL="https://t.me/c/${CLEAN_CHAT_ID}/${MSG_ID}"
          else
            TELEGRAM_POST_URL="https://t.me/alphabit_s"
          fi

          echo "telegram_post_url=$TELEGRAM_POST_URL" >> "$GITHUB_OUTPUT"
          echo "Telegram Post URL: $TELEGRAM_POST_URL"

      - name: Generate update.json
        id: generate_json
        run: |
          RELEASE_DIR="${{ steps.prepare_assets.outputs.release_dir }}"
          V_CODE="${{ steps.versioning.outputs.version_code }}"
          V_NAME="${{ steps.versioning.outputs.version_name }}"
          CHANGELOG="${{ steps.prepare_assets.outputs.changelog }}"
          APK_NAME="${{ steps.prepare_assets.outputs.apk_filename }}"
          SHA256="${{ steps.prepare_assets.outputs.apk_sha256 }}"
          TG_URL="${{ steps.send_telegram.outputs.telegram_post_url || 'https://t.me/alphabit_s' }}"
          RELEASE_TAG="v${V_NAME}"
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          UPDATE_JSON_FILE="$RELEASE_DIR/update.json"

          cat <<EOF > "$UPDATE_JSON_FILE"
          {
            "versionCode": $V_CODE,
            "versionName": "$V_NAME",
            "changelog": "$CHANGELOG",
            "apkUrl": "$APK_DOWNLOAD_URL",
            "apkSha256": "$SHA256",
            "telegramUrl": "$TG_URL",
            "mandatory": false,
            "publishedAt": "$PUBLISHED_AT"
          }
          EOF

          echo "update_json_path=$UPDATE_JSON_FILE" >> "$GITHUB_OUTPUT"
          echo "Generated update.json successfully:"
          cat "$UPDATE_JSON_FILE"

      - name: Publish Release to GitHub Releases
        id: publish_github_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="${{ steps.prepare_assets.outputs.final_apk_path }}"
          UPDATE_JSON="${{ steps.generate_json.outputs.update_json_path }}"
          V_NAME="${{ steps.versioning.outputs.version_name }}"
          V_CODE="${{ steps.versioning.outputs.version_code }}"
          RELEASE_TAG="v${V_NAME}"
          RELEASE_TITLE="Siya AI v${V_NAME}"
          CHANGELOG="${{ steps.prepare_assets.outputs.changelog }}"

          echo "Publishing release $RELEASE_TAG with APK and update.json..."

          gh release create "$RELEASE_TAG" \
            "$APK_PATH" \
            "$UPDATE_JSON" \
            --title "$RELEASE_TITLE" \
            --notes "$CHANGELOG" \
            --target "${{ github.sha }}" \
            --latest

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siya-ai-release-v${{ steps.versioning.outputs.version_name }}
          path: |
            ${{ steps.prepare_assets.outputs.final_apk_path }}
            ${{ steps.generate_json.outputs.update_json_path }}
          if-no-files-found: error
